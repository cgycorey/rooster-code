[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rooster-code"
version = "0.1.0"
description = "Rich CLI coding agent built on the Open Agent SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "open-agent-sdk",
  "prompt-toolkit>=3.0.0",
  "rich>=13.9.0",
]

[project.scripts]
rooster-code = "rooster_code.cli:main"
rooster-daemon = "rooster_code.daemon:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[project.optional-dependencies]
telegram = ["aiogram>=3.20.0"]

[tool.uv.sources]
open-agent-sdk = { git = "https://github.com/cgycorey/open-agent-sdk-python.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/rooster_code"]
